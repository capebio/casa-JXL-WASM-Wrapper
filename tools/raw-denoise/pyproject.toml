[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raw-denoise"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "onnx==1.22.0",
    "onnxruntime==1.27.0",
    "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["raw_denoise"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Standalone sandbox for the BLISS WASM SIMD (v128) decode port.
# Isolated from raw-converter-wasm/pkg so the in-flight benchmark paper's numbers are undisturbed.
# Mirrors raw-converter-wasm/src/bliss_wasm.rs; deps current bliss-core (BLSR magic, native-readable).
[workspace]  # own root — do not get absorbed into a parent workspace

[package]
name = "bliss-wasm-sandbox"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.121"                                        # MUST match installed wasm-bindgen CLI
bliss-core = { path = "../bliss/bliss-core", default-features = false }
wasm-bindgen-rayon = { version = "1", optional = true }

[features]
# MT tier: band-parallel decode via rayon + wasm-bindgen-rayon web-worker pool.
parallel = ["dep:wasm-bindgen-rayon", "bliss-core/parallel"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

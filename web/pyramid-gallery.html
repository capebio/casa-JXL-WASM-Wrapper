<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />

  <title>Pyramid Gallery (moved — redirecting)</title>
  <!-- Packet 2, Task 7 (finding 74): the modular gallery under ./pyramid-gallery/ is the CANONICAL
       gallery. The legacy M1-grid page (and its forked lightbox) is retired; this file is now a pure
       redirect kept only so old bookmarks / deep links keep resolving. The JS redirect carries the
       full query string AND hash forward (e.g. ?gallery=…#img=…) so deep links survive the hop. The
       meta-refresh is a no-JS fallback ONLY (query/hash cannot be preserved without JS). -->
  <script>
    // Preserve BOTH the query string and the hash when handing off to the canonical page, so a deep
    // link like ./pyramid-gallery.html?gallery=…#img=… lands on the same view in the modular gallery.
    (function () {
      var target = './pyramid-gallery/pyramid-gallery.html' + location.search + location.hash;
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./pyramid-gallery/pyramid-gallery.html" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
    .notice { padding: 24px; font-size: 0.95rem; }
    .notice a { color: #6b9; }
  </style>
</head>
<body>
  <p class="notice">
    This gallery has moved. Redirecting to the canonical
    <a href="./pyramid-gallery/pyramid-gallery.html">modular Pyramid gallery</a>…
  </p>
</body>

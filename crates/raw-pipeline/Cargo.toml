[package]
name = "raw-pipeline"
version = "0.1.0"
edition = "2021"

[features]
# blink lives in a sibling repo; gated so the default build never sees it.
blink-bench = ["dep:blizz"]
default = ["parallel", "jxl-codec"]
parallel = ["dep:rayon"]
# jxl-codec: BSD-clean own-FFI JXL encode + decode (jxl-ffi crate). Native only.
# Replaces the GPL jpegxl-rs / jpegxl-sys path entirely (encode + decode).
jxl-codec = ["dep:jxl-ffi", "dep:half", "dep:rayon"]
c-perceptual = []
# mhc-simd128 (P3-T11, finding 21): opt-in wasm SIMD128 MHC interior demosaic kernel.
# BIT-EXACT to scalar (proven by tests + wasm32 build), but OFF by default because the
# ≥15% median perf-acceptance gate (browser + Node WASM flipflop) has NOT been run in a
# WASM-capable env yet — the perf claim is OWED. Enable to build the v128 kernel into the
# dispatch; the perf run must pass before flipping this on in a shipped pkg. No-op off-wasm.
mhc-simd128 = []
# image-formats: general RGB image ingestion (TIFF/EXR decoders in image_formats.rs).
# Decoders ride the `image` crate already in deps; gate kept explicit.
image-formats = []
# calibrate: enables the raw_noise_calibrate CLI (pulls in no extra deps currently).
calibrate = []

[dependencies]
blizz = { path = "C:/foo/blizz-blitz", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { version = "1", optional = true }
# avif dropped: image's avif decode pulls a C dav1d dep that won't cross-compile to
# wasm; AVIF is handled browser-native. exr added (pure-Rust) for the f32 HDR path.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "exr"] }
thiserror = "1"
anyhow = "1"

# BSD-clean own FFI (bindgen over external/libjxl headers). Native only — WASM
# builds keep default-features = false and the JXL path stays on web/pkg + bridge.cpp.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jxl-ffi = { path = "../jxl-ffi", optional = true }
half = { version = "2", optional = true }

[[bin]]
name = "djxl"
path = "src/bin/djxl.rs"
required-features = ["jxl-codec"]

[[bin]]
name = "raw_noise_calibrate"
path = "src/bin/raw_noise_calibrate.rs"
required-features = ["calibrate"]

[[bin]]
name = "casv_encode"
path = "src/bin/casv_encode.rs"
required-features = ["jxl-codec"]

[[example]]
name = "orf_metric_bench"
required-features = ["parallel"]

[[example]]
name = "raw_video_exact_sha"
required-features = ["jxl-codec"]

[[example]]
name = "raw_video_decode_par_flip"
required-features = ["jxl-codec"]

# The targets below import jxl-gated modules (stream_export / casa_video /
# casabio_encode / jxl_casadecoder / jxl_casaencoder) unconditionally, so they
# only build when the feature is on. Keeps `--no-default-features` test/example
# builds green.
